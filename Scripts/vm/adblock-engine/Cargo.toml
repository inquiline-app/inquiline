# Brave's ad blocking engine (adblock-rust, MPL-2.0) for the helper's ad blocker, as a library its
# Java calls (src/lib.rs). Built by Scripts/vm/build-adblock-engine.sh.
[package]
name = "inquiline-adblock"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Without "single-thread": the proxy asks from many connections at once.
adblock = { version = "=0.13.6", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
jni = { version = "0.21", default-features = false }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
