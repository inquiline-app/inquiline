; The Android NDK for macOS (build 13750724), where its disk image installs it.
[binaries]
c = '/Applications/AndroidNDK13750724.app/Contents/NDK/toolchains/llvm/prebuilt/darwin-x86_64/bin/aarch64-linux-android35-clang'
cpp = '/Applications/AndroidNDK13750724.app/Contents/NDK/toolchains/llvm/prebuilt/darwin-x86_64/bin/aarch64-linux-android35-clang++'
ar = '/Applications/AndroidNDK13750724.app/Contents/NDK/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-ar'
strip = '/Applications/AndroidNDK13750724.app/Contents/NDK/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-strip'
pkg-config = '/usr/bin/false'
[built-in options]
cpp_link_args = ['-static-libstdc++']
[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'armv8-a'
endian = 'little'
